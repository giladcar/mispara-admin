<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>אדמין מספרה - ניהול תורים</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Heebo', sans-serif; background-color: #09090b; color: #f4f4f5; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Lock Screen -->
  <div id="lockScreen" class="fixed inset-0 bg-zinc-950 z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-xs w-full p-6 text-center shadow-2xl">
      <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center text-2xl mx-auto mb-3">🔐</div>
      <h2 class="text-lg font-black text-white">אפליקציית ניהול מספרה</h2>
      <p class="text-xs text-zinc-400 mt-1 mb-4">הזן קוד גישה (ברירת מחדל: 1234)</p>
      <input type="password" id="pinInput" placeholder="••••" class="w-full bg-zinc-950 border border-zinc-700 focus:border-emerald-500 rounded-xl px-4 py-3 text-center text-xl tracking-widest text-white outline-none mb-3">
      <button onclick="unlockAdmin()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold py-3 rounded-xl text-sm">כניסה לניהול</button>
    </div>
  </div>

  <!-- Header -->
  <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center text-zinc-950 font-black text-lg">⚙</div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-white leading-tight">ניהול מספרה (אדמין)</h1>
          <p class="text-[11px] text-emerald-400">מחובר לענן בזמן אמת</p>
        </div>
      </div>
      <div class="flex gap-2">
        <button onclick="switchTab('appointments')" id="tabAppBtn" class="bg-emerald-500 text-zinc-950 font-bold text-xs px-3 py-2 rounded-xl">כל התורים</button>
        <button onclick="switchTab('settings')" id="tabSetBtn" class="bg-zinc-800 text-zinc-300 font-bold text-xs px-3 py-2 rounded-xl">הגדרות יומן</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6">
    
    <!-- TAB 1: ALL APPOINTMENTS -->
    <div id="appointmentsTab" class="space-y-4">
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex flex-col sm:flex-row gap-3 justify-between items-center">
        <div>
          <h2 class="text-base font-bold text-white">יומן תורים מוזמנים (<span id="totalCount">0</span>)</h2>
          <p class="text-xs text-zinc-400">כאן מופיעים כל התורים של כל הלקוחות בזמן אמת</p>
        </div>
        <div class="flex gap-2 w-full sm:w-auto">
          <input type="date" id="filterDate" onchange="renderAdminAppointments()" class="bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white outline-none">
          <button onclick="document.getElementById('filterDate').value=''; renderAdminAppointments();" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-2 rounded-xl text-zinc-300">הכל</button>
        </div>
      </div>

      <div id="adminAppointmentsList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
    </div>

    <!-- TAB 2: SCHEDULE & SETTINGS -->
    <div id="settingsTab" class="hidden space-y-6">
      <!-- General Weekly Rules -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-5">
        <h2 class="text-lg font-bold text-white border-b border-zinc-800 pb-3">הגדרות שעות וימי פעילות קבועים</h2>
        
        <div>
          <label class="block text-xs font-bold text-zinc-300 mb-2">בחר ימים פתוחים בשבוע (יום לא מסומן = סגור):</label>
          <div class="grid grid-cols-4 sm:grid-cols-7 gap-2" id="daysCheckboxes"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">שעת התחלה</label>
            <input type="time" id="startTimeInput" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">שעת סיום</label>
            <input type="time" id="endTimeInput" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">אורך כל תור (בדקות)</label>
            <input type="number" id="intervalInput" min="10" max="180" step="5" class="w-full bg-zinc-950 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-white">
          </div>
        </div>

        <button onclick="saveGeneralSettings()" class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-bold px-6 py-3 rounded-xl text-sm shadow-lg">
          שמור הגדרות לכל הלקוחות ✓
        </button>
      </div>

      <!-- Block Specific Date or Slot -->
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-4">
        <h2 class="text-lg font-bold text-white border-b border-zinc-800 pb-3">חסימת תאריך ספציפי (חופש / חג) או שעה בודדת</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3">
            <label class="block text-xs font-bold text-zinc-300">סגירת יום שלם:</label>
            <div class="flex gap-2">
              <input type="date" id="blockDateInput" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3 py-2 text-xs text-white">
              <button onclick="toggleBlockDate()" class="bg-rose-500 hover:bg-rose-400 text-white font-bold text-xs px-4 py-2 rounded-xl">חסום/שחרר יום</button>
            </div>
            <div id="blockedDatesList" class="flex flex-wrap gap-1.5 pt-2"></div>
          </div>

          <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-3">
            <label class="block text-xs font-bold text-zinc-300">חסימת שעה ספציפית בתאריך:</label>
            <div class="flex gap-2">
              <input type="date" id="blockSlotDate" class="bg-zinc-900 border border-zinc-700 rounded-xl px-2 py-2 text-xs text-white">
              <input type="time" id="blockSlotTime" class="bg-zinc-900 border border-zinc-700 rounded-xl px-2 py-2 text-xs text-white">
              <button onclick="addBlockedSlot()" class="bg-amber-500 text-zinc-950 font-bold text-xs px-3 py-2 rounded-xl">חסום</button>
            </div>
            <div id="blockedSlotsList" class="flex flex-wrap gap-1.5 pt-2"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <div id="toast" class="fixed bottom-5 right-5 left-5 sm:left-auto sm:w-80 bg-zinc-800 border border-emerald-500/40 text-white px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transform translate-y-24 opacity-0 transition-all duration-300 z-50 text-center"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, collection, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCN3-QXjz-6u8ynxjN8END8kEKuxXBF43U",
      authDomain: "saparot-51229.firebaseapp.com",
      projectId: "saparot-51229",
      storageBucket: "saparot-51229.firebasestorage.app",
      messagingSenderId: "421595658226",
      appId: "1:421595658226:web:840b3f1c4920766bb51d6b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const daysHe = ["ראשון", "שני", "שלישי", "רביעי", "חמישי", "שישי", "שבת"];

    let settings = {
      activeDays: [0, 1, 2, 3, 4, 5],
      startTime: "15:00",
      endTime: "20:00",
      interval: 45,
      blockedDates: [],
      blockedSlots: []
    };
    let appointments = [];

    window.unlockAdmin = function() {
      const pin = document.getElementById('pinInput').value;
      if (pin === "1234") {
        document.getElementById('lockScreen').classList.add('hidden');
      } else {
        alert("קוד שגוי");
      }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('translate-y-24', 'opacity-0');
      setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 3000);
    }

    window.switchTab = function(tab) {
      document.getElementById('appointmentsTab').classList.toggle('hidden', tab !== 'appointments');
      document.getElementById('settingsTab').classList.toggle('hidden', tab !== 'settings');
      document.getElementById('tabAppBtn').className = tab === 'appointments' ? 'bg-emerald-500 text-zinc-950 font-bold text-xs px-3 py-2 rounded-xl' : 'bg-zinc-800 text-zinc-300 font-bold text-xs px-3 py-2 rounded-xl';
      document.getElementById('tabSetBtn').className = tab === 'settings' ? 'bg-emerald-500 text-zinc-950 font-bold text-xs px-3 py-2 rounded-xl' : 'bg-zinc-800 text-zinc-300 font-bold text-xs px-3 py-2 rounded-xl';
    };

    onSnapshot(doc(db, "config", "settings"), (snap) => {
      if (snap.exists()) {
        settings = { ...settings, ...snap.data() };
      }
      populateSettingsUI();
    });

    onSnapshot(collection(db, "appointments"), (snapshot) => {
      appointments = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAdminAppointments();
    });

    function populateSettingsUI() {
      const daysDiv = document.getElementById('daysCheckboxes');
      daysDiv.innerHTML = daysHe.map((name, idx) => {
        const active = settings.activeDays.includes(idx);
        return `
          <label class="cursor-pointer border rounded-xl p-2.5 text-center text-xs font-bold transition ${active ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-zinc-950 border-zinc-800 text-zinc-500'}">
            <input type="checkbox" value="${idx}" ${active ? 'checked' : ''} class="hidden day-cb">
            יום ${name}
          </label>
        `;
      }).join('');

      document.querySelectorAll('.day-cb').forEach(cb => {
        cb.addEventListener('change', (e) => {
          const lbl = e.target.parentElement;
          lbl.className = e.target.checked
            ? 'cursor-pointer border rounded-xl p-2.5 text-center text-xs font-bold transition bg-emerald-500/20 border-emerald-500 text-emerald-300'
            : 'cursor-pointer border rounded-xl p-2.5 text-center text-xs font-bold transition bg-zinc-950 border-zinc-800 text-zinc-500';
        });
      });

      document.getElementById('startTimeInput').value = settings.startTime;
      document.getElementById('endTimeInput').value = settings.endTime;
      document.getElementById('intervalInput').value = settings.interval;

      document.getElementById('blockedDatesList').innerHTML = (settings.blockedDates || []).map(d => `
        <span class="bg-rose-500/20 text-rose-300 border border-rose-500/30 text-[11px] px-2 py-1 rounded-lg flex items-center gap-1.5">
          ${d} <button onclick="removeBlockedDate('${d}')" class="font-bold">✕</button>
        </span>
      `).join('');

      document.getElementById('blockedSlotsList').innerHTML = (settings.blockedSlots || []).map(s => `
        <span class="bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[11px] px-2 py-1 rounded-lg flex items-center gap-1.5">
          ${s.replace('_', ' | ')} <button onclick="removeBlockedSlot('${s}')" class="font-bold">✕</button>
        </span>
      `).join('');
    }

    window.saveGeneralSettings = async function() {
      const checkedDays = Array.from(document.querySelectorAll('.day-cb:checked')).map(cb => Number(cb.value));
      settings.activeDays = checkedDays;
      settings.startTime = document.getElementById('startTimeInput').value;
      settings.endTime = document.getElementById('endTimeInput').value;
      settings.interval = Number(document.getElementById('intervalInput').value);

      await setDoc(doc(db, "config", "settings"), settings);
      showToast("ההגדרות נשמרו ועודכנו אצל כולם!");
    };

    window.toggleBlockDate = async function() {
      const d = document.getElementById('blockDateInput').value;
      if (!d) return;
      settings.blockedDates = settings.blockedDates || [];
      if (!settings.blockedDates.includes(d)) {
        settings.blockedDates.push(d);
      }
      await setDoc(doc(db, "config", "settings"), settings);
      showToast(`התאריך ${d} נחסם`);
    };

    window.removeBlockedDate = async function(d) {
      settings.blockedDates = (settings.blockedDates || []).filter(item => item !== d);
      await setDoc(doc(db, "config", "settings"), settings);
      showToast(`התאריך ${d} נפתח מחדש`);
    };

    window.addBlockedSlot = async function() {
      const d = document.getElementById('blockSlotDate').value;
      const t = document.getElementById('blockSlotTime').value;
      if (!d || !t) return;
      const key = `${d}_${t}`;
      settings.blockedSlots = settings.blockedSlots || [];
      if (!settings.blockedSlots.includes(key)) {
        settings.blockedSlots.push(key);
        await setDoc(doc(db, "config", "settings"), settings);
        showToast(`השעה ${t} בתאריך ${d} נחסמה`);
      }
    };

    window.removeBlockedSlot = async function(key) {
      settings.blockedSlots = (settings.blockedSlots || []).filter(item => item !== key);
      await setDoc(doc(db, "config", "settings"), settings);
      showToast("השעה שוחררה");
    };

    window.renderAdminAppointments = function() {
      const filterDate = document.getElementById('filterDate').value;
      let list = [...appointments].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
      if (filterDate) {
        list = list.filter(a => a.date === filterDate);
      }
      document.getElementById('totalCount').textContent = list.length;

      const container = document.getElementById('adminAppointmentsList');
      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-zinc-500 text-sm bg-zinc-900/50 rounded-2xl border border-zinc-800">אין תורים להצגה</div>`;
        return;
      }

      container.innerHTML = list.map(app => {
        const d = new Date(app.date + 'T00:00:00');
        return `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-bold px-2.5 py-0.5 rounded-lg">${app.time}</span>
                <span class="text-sm font-bold text-white">יום ${daysHe[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}</span>
              </div>
              <p class="text-base font-bold text-zinc-200 mt-2">${app.firstName} ${app.lastName}</p>
              <a href="tel:${app.phone}" class="text-xs text-amber-400 hover:underline mt-0.5 inline-block" dir="ltr">📞 ${app.phone}</a>
            </div>
            <button onclick="adminCancel('${app.id}')" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-md">
              בטל תור
            </button>
          </div>
        `;
      }).join('');
    };

    window.adminCancel = async function(id) {
      if (!confirm("לבטל את התור של הלקוח?")) return;
      await deleteDoc(doc(db, "appointments", id));
      showToast("התור בוטל והשעה התפנתה ביומן");
    };
  </script>
</body>
</html>
